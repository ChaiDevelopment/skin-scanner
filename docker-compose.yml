# Local container run of the backend. Secrets come from backend/.env (never committed).
#   docker compose up --build
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Containers default to production; DEV_AUTH_BYPASS is refused in production.
      NODE_ENV: ${NODE_ENV:-production}
      DEV_AUTH_BYPASS: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
